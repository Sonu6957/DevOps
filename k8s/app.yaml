apiVersion: apps/v1
kind: Deployment
metadata:
  name: springapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springapp
  template:
    metadata:
      labels:
        app: springapp
    spec:
      containers:
        - name: springapp
          image: embarkx/hello-spring:latest
          env:
            - name: ENV_VALUE
              value: "Hello from Springapp yaml"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: springapp
spec:
  selector:
    app: springapp
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
      
