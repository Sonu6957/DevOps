name: CI/CD for a springboot application in Azure

on:
    workflow_dispatch

jobs:
    build_test:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout artifact
          uses: actions/checkout@v6

        - name: Setup-JDK
          uses: actions/setup-java@v5
          with:
            distribution: 'temurin' # See 'Supported distributions' for available options
            java-version: '21'

        - name: Maven build and test
          working-directory: docker/app1-hello/springboot/hello-spring
          run: mvn -B clean verify

        - name: Upload test results
          uses: actions/upload-artifact@v4

          with:
            name: TestReport
            path: docker/app1-hello/springboot/hello-spring
            
    docker-build-push:
            runs-on: ubuntu-latest
            needs: build_test
            steps:
            - name: Checkout artifact
              uses: actions/checkout@v6

            - name: Setup-JDK
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin' # See 'Supported distributions' for available options
                java-version: '21'

            - name: Build JAR for docker
              working-directory: docker/app1-hello/springboot/hello-spring
              run: mvn -B clean package -DskipTests

            - name: Login to Dockerhub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}
            
            - name: push to Dockerhub
              uses: docker/build-push-action@v7
              with:
                context: docker/app1-hello/springboot/hello-spring
                push: true
                tags: ${{secrets.DOCKERHUB_USERNAME}}/spring-app:latest 
    
    deploy-azure-aks:
        runs-on: ubuntu-latest
        needs: docker-build-push
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            
            - name: authenticate
              uses: azure/login@v3
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Setup kubectl
              uses: azure/setup-kubectl@v4

            - name: set AKS context
              uses: azure/k8s-set-context@v5
              with:
                cluster-name: ${{ secrets.AZURE_CLUSTER_NAME }}
                resource-group: ${{ secrets.AZURE_RESOURCE_GRP }}
            
            - name: Verify connection
              run: kubectl get nodes
            
            - name: Deploy the application
              run: kubectl apply -f k8s
             

        

        


                    
        
          
