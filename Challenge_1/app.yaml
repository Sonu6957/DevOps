apiVersion: apps/v1
kind: Deployment
metadata:
  name: pythonapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pythonapp
  template:
    metadata:
      labels:
        app: pythonapp
    spec:
      containers:
        - name: pythonapp
          image: embarkx/hello-python:stable
          env:
            - name: ENV_VALUE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ENV_VALUE
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: pythonapp
spec:
  selector:
    app: pythonapp
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30003
