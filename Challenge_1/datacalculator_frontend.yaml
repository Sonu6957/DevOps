apiVersion: apps/v1
kind: Deployment
metadata:
  name: datacalculatorfrontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: datacalculatorfrontend
  template:
    metadata:
      labels:
        app: datacalculatorfrontend
    spec:
      containers:
        - name: datacalculatorfrontend
          env:
          - name: VITE_API_URL
            value: http://localhost:31000
          image: sonu6957/service-taxcalculator_frontend:latest
          # env:
          #   - name: ENV_VALUE
          #     valueFrom:
          #       configMapKeyRef:
          #         name: app-config
          #         key: ENV_VALUE
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: datacalculatorfrontend
spec:
  selector:
    app: datacalculatorfrontend
  type: NodePort
  ports:
    - port: 80
      nodePort: 30009
      targetPort: 80
      